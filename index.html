<!DOCTYPE html>
<html lang="en" class="body compact">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
    <title>Faceit Widget</title>
    
    <!-- Carregar o CSS local -->
    <link href="widget-dark.css" rel="stylesheet">
    
    <!-- Carregar o jQuery local -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    
    
</head>

<body id="body">
    <div class="row">
        <div class="wrapper">
            <div class="widget">
                <div class="level">
                    <img id="level" src="https://strugly.com/lvls/svg/0.svg" alt="Player Level">
                    <div class="elo">
                        <h2>Loading...</h2>
                        <p>0000 ELO (+0)</p>
                    </div>
                </div>
                <div class="matches">
                    <div class="stats">
                        <div id="wins" class="stat green"><p>0</p><small>wins</small></div>
                        <div id="loses" class="stat red"><p>0</p><small>losses</small></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Obtém o nome do jogador a partir da URL (query string)
        const url = new URLSearchParams(window.location.search);
        var nickname = url.get('player');
        nickname = (nickname == null) ? "Loading..." : nickname;

        var hostname = location.hostname;
        var elodisplay = $('.elo');
        var wins = $('#wins');
        var loses = $('#loses');
        var levelimage = $('#level');

        // Função para atualizar os dados de ELO
        function updateelo() {
            var oReq = new XMLHttpRequest();
            oReq.open('GET', `https://api.faceit.com/stats/v2/players/Sk1llerss?game=csgo`, true);
            oReq.send();

            oReq.onload = function () {
                if (oReq.status === 200) {
                    try {
                        let data = JSON.parse(oReq.responseText);
                        
                        // Verifica se a resposta tem dados do jogador
                        if (data && data.games && data.games.csgo) {
                            const playerStats = data.games.csgo;
                            const elo = playerStats.faceit_elo;
                            const winsCount = playerStats.stats.total_wins;
                            const lossesCount = playerStats.stats.total_losses;
                            const level = playerStats.skill_level;

                            // Atualiza a imagem do nível e os dados de ELO
                            levelimage.attr('src', `https://strugly.com/lvls/svg/${level}.svg`);
                            elodisplay.html(`<h2>${nickname}</h2><p>${elo} ELO</p>`);
                            wins.html(`<p>${winsCount}</p><small>wins</small>`);
                            loses.html(`<p>${lossesCount}</p><small>losses</small>`);
                        }
                    } catch (e) {
                        console.error('Erro ao processar dados da Faceit', e);
                        elodisplay.html('<h2>Error loading data</h2>');
                    }
                } else {
                    console.error('Erro na requisição', oReq.status);
                }
            };

            oReq.onerror = function () {
                console.error('Erro na requisição');
                elodisplay.html('<h2>Unable to fetch data</h2>');
            };
        }

        // Inicia a função de carregamento dos dados
        updateelo();
    </script>
</body>
</html>
