<body id="body">

</div>

<script>
	let hostname = location.hostname;
	var creatortext = "<h2>Get widget: </h2><p>STRUGLY.COM</p>";
	function show_block(blockname, datas, timer) {
		setTimeout(function(){
		elodisplay.stop().css('opacity', '0');
		elodisplay.html(datas);
		elodisplay.animate({opacity: 1});
		}, timer);
	}
function widget_restart() {
	$("#body").fadeOut(1000, function(){
            location.reload(true);
        });
}
    function updateelo() {
	let startDate = new Date()
        startDate.setHours(startDate.getHours() - 12)
        startDate.setMinutes(0)
        startDate.setSeconds(0);
	
	if(example == 1) {
		example = '&example='+example;
	} else {
		example = '';
	}
	
	startDate = startDate.getTime();
        var oReq = new XMLHttpRequest();
				oReq.open('GET', '../api/faceit_api_v2.php?player=' + nickname + '&secret=b17bb8a78e35ec79f71ee534f68203b1&fields=ranking,edwl&time='+ startDate + example);
		        oReq.send();
        oReq.onload = function () {
			if (oReq.status === 200) {
				
try {
            data = JSON.parse(oReq.responseText);

} catch(e) {
    setTimeout(function(){
   widget_restart();
}, 10000);
}
if (typeof data.timer == 'undefined') {
				data.timer = 60;
			} else if(data.timer > 0) {
				
			} else {
				data.timer = 60;
			}
			const toparr=['1', '2', '3'];
			if(toparr.includes(data.rank)) { 
			svg_img = 'top'+data.rank;
			data.faceit_elo = "#"+data.rank+" / "+data.faceit_elo;
			} else if(data.rank <= 1000) { 
			svg_img = 'top1000';
			data.faceit_elo = "#"+data.rank+" / "+data.faceit_elo;
			} else { 
			svg_img = data.skill_level; 
			}
			
            levelimage.attr('src', "//"+hostname+"/lvls/svg/" + svg_img + ".svg");
            elodisplay.html("<h2>"+data.nickname+"</h2><p>"+data.faceit_elo+" ELO ("+data.stats.today_elo+")</p>");
			wins.html("<p>"+data.stats.today_wins+"</p><small>wins</small>");
			loses.html("<p>"+data.stats.today_loses+"</p><small>losses</small>");
			
			
			//hostnamedisplay.innerText = " "+hostname;

			show_block('creator', "<h2>Get widget: </h2><p>"+data.ads_link+"</p>", data.timer*1000-5000);
			show_block('statistic', "<h2>"+data.nickname+"</h2><p>"+data.faceit_elo+" ELO ("+data.stats.today_elo+")</p>", data.timer*1000-1);
			}
setTimeout(function(){
	console.log("reloading...");
	updateelo();
}, data.timer*1000);
			} else {
setTimeout(function(){
	updateelo();
	}, 5000);
			}
        }
		oReq.onerror = function () {
setTimeout(function(){
	updateelo();
	}, 5000);
